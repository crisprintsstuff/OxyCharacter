[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crisprintsstuff/OxyCharacter"

[workspace.dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
oxy-mesh = { path = "crates/oxy-mesh" }
oxy-morph = { path = "crates/oxy-morph" }
oxy-rig = { path = "crates/oxy-rig" }
oxy-io = { path = "crates/oxy-io" }
oxy-project = { path = "crates/oxy-project" }

# Keep dependency-heavy crates fast in dev builds (morph evaluation, Bevy).
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
