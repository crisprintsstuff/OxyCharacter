[package]
name = "oxy-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "oxycharacter"
path = "src/main.rs"

[dependencies]
oxy-mesh.workspace = true
oxy-morph.workspace = true
oxy-io.workspace = true
oxy-rig.workspace = true
oxy-project.workspace = true
oxy-material.workspace = true
oxy-fit.workspace = true
serde_json = "1"
bevy = { version = "0.20.1", default-features = false, features = [
    "3d_bevy_render", "default_app", "std", "bevy_winit", "multi_threaded",
    "x11", "bevy_window", "default_font", "png",
] }
bevy_egui = { version = "0.43.1", default-features = false, features = ["render", "default_fonts"] }

[lints]
workspace = true
