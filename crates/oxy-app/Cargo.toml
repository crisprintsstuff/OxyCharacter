[package]
name = "oxy-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "oxycharacter"
path = "src/main.rs"

[dependencies]
oxy-mesh.workspace = true
oxy-morph.workspace = true
oxy-io.workspace = true
oxy-rig.workspace = true
oxy-project.workspace = true
oxy-material.workspace = true
oxy-fit.workspace = true
serde_json = "1"
bevy = { version = "0.20.1", default-features = false, features = [
    "3d_bevy_render", "default_app", "std", "bevy_winit", "multi_threaded",
    "x11", "bevy_window", "default_font", "png",
] }
bevy_egui = { version = "0.43.1", default-features = false, features = ["render", "default_fonts"] }
# Direct dependency so the theme module can stay egui-only (bevy_egui re-exports
# the same crate; versions must match).
egui = "0.36"
# Native open/save dialogs. Linux uses the XDG desktop portal (no GTK).
# The async API is polled from the UI thread so the editor keeps drawing.
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }

[lints]
workspace = true
